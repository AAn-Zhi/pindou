<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豆豆工坊｜我的账号</title><style>body{font-family:system-ui,"Microsoft YaHei";background:#f7f4fc;color:#332c42;display:grid;place-items:center;min-height:90vh}.card{background:white;padding:30px;border-radius:20px}a,button{display:inline-block;margin:8px;padding:10px;background:#eee9fa;color:#57428b;border:0;border-radius:8px;cursor:pointer}</style><div class="card"><h2>我的账号</h2><p id="who">正在加载…</p><a href="index.html">制作图纸</a><a href="gallery.html">我的图纸库</a><button id="logout">退出登录</button></div><script>fetch('/api/auth/me').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>document.getElementById('who').textContent=d.user.email).catch(()=>location.href='login.html');document.getElementById('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='index.html'};</script></html>
