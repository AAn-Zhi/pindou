<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>豆豆工坊｜图片编辑</title>
<style>
*{box-sizing:border-box}:root{--ink:#302b35;--muted:#756d7b;--pink:#d77ba6;--purple:#8c7bd0;--line:#eadfea}
body{margin:0;color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(135deg,#fff8fb,#f5f2ff);min-height:100vh}
header{text-align:center;padding:28px 20px 15px}.logo{font-size:28px;font-weight:900}.logo span{color:var(--pink)}header p{color:var(--muted);font-size:13px}
main{max-width:1050px;margin:auto;padding:10px 18px 45px}.card{background:#fffffff2;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 35px #55385f0c}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:15px}input[type=file],select{padding:10px;border:1px solid #ded3e2;border-radius:11px;background:#fff}button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(100deg,#d77ba6,#8c7bd0);color:#fff}.secondary{background:#f2edf8;color:#5e4d78}.danger{background:#fff0f3;color:#b04f70}
.stage{min-height:500px;background:repeating-conic-gradient(#faf8fb 0 25%,#f1edf4 0 50%) 50%/20px 20px;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px}.canvas-wrap{position:relative;display:inline-block;line-height:0;box-shadow:0 8px 30px #0002}.canvas-wrap img{display:block;max-width:min(900px,90vw);max-height:650px;width:auto;height:auto}.selection{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px #231a2b66;display:none;cursor:move}.selection:after{content:"";position:absolute;inset:7px;border:1px dashed #fff8}.hint{color:var(--muted);font-size:13px;line-height:1.6;margin:10px 0}.result{display:none;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.result img{max-width:100%;max-height:300px;border-radius:12px;border:1px solid var(--line)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{color:#4f9a7d;font-size:13px;margin-top:10px}
</style></head><body>
<header><div class="logo">✂ <span>豆豆工坊</span> 图片编辑</div><p>拖动鼠标框选主体，再应用裁剪；也可以顺便调整输出宽度。</p></header>
<main><div class="card">
<div class="toolbar"><input id="file" type="file" accept="image/*"><label>输出宽度 <select id="scale"><option value="0">保持裁剪后的原尺寸</option><option value="500">500 px</option><option value="800" selected>800 px</option><option value="1200">1200 px</option><option value="1600">1600 px</option><option value="2000">2000 px</option></select></label><button class="primary" id="apply" disabled>应用裁剪</button><button class="secondary" id="back">返回生成</button></div>
<p class="hint">① 先选择图片。② 在图片上按住鼠标拖动出矩形区域。③ 点击“应用裁剪”。如果不框选，则保留整张图片。</p>
<div class="stage"><div class="canvas-wrap" id="wrap"><img id="img" alt="待编辑图片"><div class="selection" id="sel"></div></div><div id="empty" class="hint">请选择一张图片开始编辑。</div></div>
<div class="result" id="result"><h3>裁剪结果</h3><img id="resultImg"><div class="row" style="margin-top:12px"><button class="primary" id="use">使用这张图片</button><button class="secondary" id="again">重新裁剪</button></div><div class="status" id="status"></div></div>
</div></main>
<script>
(()=>{const file=document.getElementById('file'),img=document.getElementById('img'),sel=document.getElementById('sel'),wrap=document.getElementById('wrap'),empty=document.getElementById('empty'),apply=document.getElementById('apply'),scale=document.getElementById('scale'),result=document.getElementById('result'),resultImg=document.getElementById('resultImg'),use=document.getElementById('use'),again=document.getElementById('again'),status=document.getElementById('status'),back=document.getElementById('back');let naturalW=0,naturalH=0,drag=false,startX=0,startY=0,box=null,currentUrl='';
function load(url){img.onload=()=>{naturalW=img.naturalWidth;naturalH=img.naturalHeight;currentUrl=url;empty.style.display='none';apply.disabled=false;sel.style.display='none';result.style.display='none'};img.src=url}
file.onchange=()=>{const f=file.files?.[0];if(!f)return;if(f.size>12*1024*1024){status.textContent='图片超过 12 MB';return}const r=new FileReader();r.onload=()=>load(r.result);r.readAsDataURL(f)};
function point(e){const r=img.getBoundingClientRect();return{x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top))}}
wrap.addEventListener('pointerdown',e=>{if(!img.src)return;const p=point(e);drag=true;startX=p.x;startY=p.y;sel.style.display='block';sel.style.left=startX+'px';sel.style.top=startY+'px';sel.style.width='0px';sel.style.height='0px';wrap.setPointerCapture(e.pointerId)});
wrap.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),x=Math.min(startX,p.x),y=Math.min(startY,p.y),w=Math.abs(p.x-startX),h=Math.abs(p.y-startY);sel.style.left=x+'px';sel.style.top=y+'px';sel.style.width=w+'px';sel.style.height=h+'px';box={x,y,w,h}});
wrap.addEventListener('pointerup',()=>drag=false);
apply.onclick=()=>{if(!img.src)return;const r=img.getBoundingClientRect(),sx=naturalW/r.width,sy=naturalH/r.height;let b=box;if(!b||b.w<8||b.h<8)b={x:0,y:0,w:r.width,h:r.height};const c=document.createElement('canvas');let w=Math.round(b.w*sx),h=Math.round(b.h*sy),target=+scale.value;if(target>0&&w>target){h=Math.round(h*target/w);w=target}c.width=w;c.height=h;c.getContext('2d').drawImage(img,b.x*sx,b.y*sy,b.w*sx,b.h*sy,0,0,w,h);resultImg.src=c.toDataURL('image/jpeg',.92);result.style.display='block';status.textContent=`已裁剪为 ${w} × ${h} px，可返回生成页面。`};
use.onclick=()=>{sessionStorage.setItem('doudou_edited_image',resultImg.src);location.href='index.html'};
again.onclick=()=>{result.style.display='none';sel.style.display='none';box=null};
back.onclick=()=>location.href='index.html';
const pending=sessionStorage.getItem('doudou_editor_source');if(pending){sessionStorage.removeItem('doudou_editor_source');load(pending)}
})();
</script></body></html>
