<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>豆豆工坊｜我的图纸库</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --ink: #302b35;
        --muted: #756d7b;
        --pink: #d77ba6;
        --purple: #8c7bd0;
        --line: #eadfea;
      }
      body {
        margin: 0;
        color: var(--ink);
        font-family: 'Microsoft YaHei', system-ui, sans-serif;
        background: linear-gradient(135deg, #fff8fb, #f5f2ff);
        min-height: 100vh;
      }
      header {
        text-align: center;
        padding: 30px 20px 15px;
      }
      .logo {
        font-size: 29px;
        font-weight: 900;
      }
      .logo span {
        color: var(--pink);
      }
      header p {
        color: var(--muted);
        font-size: 13px;
      }
      main {
        max-width: 1120px;
        margin: auto;
        padding: 12px 18px 50px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        gap: 10px;
        flex-wrap: wrap;
      }
      .topbar h2 {
        margin: 0;
        font-size: 20px;
      }
      a,
      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }
      .back {
        background: #f1ecf8;
        color: #5e4d78;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
        gap: 16px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 30px #55385f0b;
      }
      .thumb {
        height: 180px;
        background: #f8f5fa;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .thumb img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .body {
        padding: 15px;
      }
      .name {
        font-weight: 900;
        font-size: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .time {
        font-size: 11px;
        color: var(--muted);
        margin: 5px 0 12px;
      }
      .meta {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .tag {
        background: #f8f3fb;
        color: #665878;
        padding: 5px 8px;
        border-radius: 8px;
        font-size: 11px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 13px;
      }
      .load {
        flex: 1;
        color: #fff;
        background: linear-gradient(100deg, #d77ba6, #8c7bd0);
      }
      .del {
        background: #fff0f3;
        color: #b04f70;
      }
      .empty {
        padding: 70px 20px;
        text-align: center;
        background: #fff;
        border: 1px dashed #d9cddd;
        border-radius: 18px;
        color: var(--muted);
        line-height: 1.8;
      }
      .empty a {
        display: inline-block;
        margin-top: 12px;
        background: #f1ecf8;
        color: #5e4d78;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">🗂 <span>豆豆工坊</span> 我的图纸库</div>
      <p>登录后可以查看和管理自己的云端图纸，其他用户无法访问。</p>
    </header>
    <main>
      <div class="topbar">
        <h2>我的作品 <span id="count" style="color: #a99fac; font-size: 13px"></span></h2>
        <a class="back" href="index.html">← 返回生成页面</a>
      </div>
      <div id="list"></div>
    </main>
    <script>
      (() => {
        const list = document.getElementById('list'),
          count = document.getElementById('count');
        let data = [];
        function esc(s) {
          return String(s ?? '').replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
          );
        }
        async function render() {
          list.innerHTML = '<div class="empty">正在从 MySQL 读取图纸…</div>';
          try {
            const r = await fetch('/api/patterns');
            const result = await r.json();
            if (r.status === 401) {
              location.href = 'login.html?next=gallery.html';
              return;
            }
            if (!r.ok || !result.success) throw new Error(result.message || '读取失败');
            data = result.data || [];
            count.textContent = `共 ${data.length} 张`;
            if (!data.length) {
              list.innerHTML =
                '<div class="empty">还没有保存的图纸。<br>生成一张喜欢的拼豆图纸后，点击“保存到我的图纸库”即可。<br><a href="index.html">去制作第一张图纸 ✨</a></div>';
              return;
            }
            list.className = 'grid';
            list.innerHTML = data
              .map(
                (x) =>
                  `<article class="card"><div class="thumb">${x.thumb ? `<img src="${x.thumb}" alt="">` : '<span style="color:#aaa">无预览</span>'}</div><div class="body"><div class="name" title="${esc(x.name)}">${esc(x.name)}</div><div class="time">${esc(x.created_at || '')}</div><div class="meta"><span class="tag">${x.width} × ${x.height} 格</span><span class="tag">${x.color_count} 种颜色</span><span class="tag">${x.total_beads} 颗</span></div><div class="actions"><button class="load" data-id="${x.id}">打开图纸</button><button class="del" data-id="${x.id}">删除</button></div></div></article>`
              )
              .join('');
            list
              .querySelectorAll('.load')
              .forEach(
                (b) =>
                  (b.onclick = () =>
                    (location.href = `index.html?load=${encodeURIComponent(b.dataset.id)}`))
              );
            list.querySelectorAll('.del').forEach(
              (b) =>
                (b.onclick = async () => {
                  if (!confirm('确定从 MySQL 删除这张图纸吗？')) return;
                  try {
                    const r = await fetch(`/api/patterns/${encodeURIComponent(b.dataset.id)}`, {
                      method: 'DELETE',
                    });
                    const result = await r.json();
                    if (!r.ok || !result.success) throw new Error(result.message || '删除失败');
                    render();
                  } catch (e) {
                    alert('删除失败：' + e.message);
                  }
                })
            );
          } catch (e) {
            count.textContent = '读取失败';
            list.innerHTML = `<div class="empty">无法连接后端：${esc(e.message)}<br>请确认服务器正在运行。</div>`;
          }
        }
        render();
      })();
    </script>
    <script src="auth.js"></script>
  </body>
</html>
