<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>豆豆工坊｜我的账号</title>
  <style>
    *{box-sizing:border-box}body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f7f4fc;color:#332c42;display:grid;place-items:center;min-height:90vh;margin:0;padding:20px}
    .card{background:white;padding:30px;border-radius:20px;width:min(100%,500px);box-shadow:0 8px 30px #332c4210}
    a,button{display:inline-block;margin:8px 8px 8px 0;padding:10px 14px;background:#eee9fa;color:#57428b;border:0;border-radius:8px;cursor:pointer;font:inherit;text-decoration:none}
    button:disabled{opacity:.6;cursor:not-allowed}.danger{border-top:1px solid #e9e4ed;margin-top:22px;padding-top:15px}
    .danger-button{background:#fff0f0;color:#a52b37}.danger-confirm{background:#ad3442;color:white}
    .warning{color:#8d3440;font-size:14px;line-height:1.7}.panel{margin-top:12px;background:#fff8f8;border:1px solid #f1d8da;padding:16px;border-radius:12px}
    label{display:block;font-size:14px;margin:12px 0 6px}input{width:100%;padding:11px;border:1px solid #d5cbd9;border-radius:8px;font:inherit}
    #status{font-size:14px;min-height:20px} [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <h2>我的账号</h2>
    <p id="who">正在加载…</p>
    <a href="index.html">制作图纸</a>
    <a href="gallery.html">我的图纸库</a>
    <button id="logout" type="button">退出登录</button>
    <section class="danger">
      <h3>注销账号</h3>
      <p class="warning">注销后，此账号及账号下保存的全部图纸将永久删除，无法恢复。请先导出需要保留的图纸。</p>
      <button class="danger-button" id="openDelete" type="button">注销账号…</button>
      <div class="panel" id="deletePanel" hidden>
        <p class="warning"><strong>请确认：</strong>你将永久删除当前账号和所有云端图纸。</p>
        <form id="deleteForm">
          <label for="password">输入当前账号密码以确认</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <label><input id="ack" type="checkbox" style="width:auto;margin-right:6px">我了解账号及全部图纸将永久删除且无法恢复</label>
          <button class="danger-confirm" id="confirmDelete" type="submit">确认永久注销</button>
          <button id="cancelDelete" type="button">取消</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script>
    fetch('/api/auth/me').then(r=>{if(!r.ok)throw Error();return r.json()})
      .then(d=>document.getElementById('who').textContent=d.user.email)
      .catch(()=>location.href='login.html');
    document.getElementById('logout').onclick=async()=>{
      await fetch('/api/auth/logout',{method:'POST'});
      location.href='index.html';
    };
    const panel=document.getElementById('deletePanel');
    const form=document.getElementById('deleteForm');
    const status=document.getElementById('status');
    document.getElementById('openDelete').onclick=()=>{
      panel.hidden=false;
      document.getElementById('password').focus();
    };
    document.getElementById('cancelDelete').onclick=()=>{
      panel.hidden=true;form.reset();status.textContent='';
    };
    form.onsubmit=async(event)=>{
      event.preventDefault();
      if(!document.getElementById('ack').checked){status.textContent='请先勾选确认说明';return;}
      const password=document.getElementById('password').value;
      if(!password){status.textContent='请输入当前账号密码';return;}
      if(!confirm('最后确认：永久删除此账号及其全部图纸？此操作无法撤销。'))return;
      const button=document.getElementById('confirmDelete');
      button.disabled=true;status.textContent='正在处理注销请求…';
      try{
        const response=await fetch('/api/auth/account',{
          method:'DELETE',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({password})
        });
        const data=await response.json();
        if(!response.ok||!data.success){status.textContent=data.message||'注销失败，请稍后重试';return;}
        alert('账号及全部图纸已永久删除');
        location.replace('login.html');
      }catch(error){status.textContent='网络异常，请检查连接后重试';}
      finally{button.disabled=false;document.getElementById('password').value='';}
    };
  </script>
</body>
</html>
