<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>豆豆工坊｜登录注册</title
  ><style>
    body {
      font-family: system-ui, 'Microsoft YaHei';
      background: linear-gradient(130deg, #fff8fb, #f0efff);
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #332c42;
    }
    .panel {
      background: white;
      border-radius: 20px;
      padding: 32px;
      max-width: 390px;
      width: calc(100% - 30px);
      box-shadow: 0 12px 38px #44335517;
    }
    h1 {
      font-size: 25px;
    }
    input,
    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid #ddd3e8;
      font: inherit;
    }
    button {
      background: #7361ae;
      color: white;
      border: 0;
      cursor: pointer;
    }
    a {
      color: #6753a0;
    }
    #msg {
      min-height: 22px;
      color: #a83c59;
    }
  </style>
  <div class="panel">
    <h1>豆豆工坊 · 账号</h1>
    <p>游客可免费制作图纸；登录后可以保存到个人云端图纸库。</p>
    <form id="f">
      <input
        type="email"
        id="email"
        placeholder="邮箱地址"
        autocomplete="email"
        required
        maxlength="254"
      /><input
        type="password"
        id="password"
        placeholder="密码（注册至少10位）"
        autocomplete="current-password"
        required
      /><button type="submit" id="login">登录</button
      ><button type="button" id="register">注册新账号</button>
    </form>
    <div id="msg" role="status"></div>
    <a href="index.html">← 返回制作页面</a>
  </div>
  <script>
    const f = document.getElementById('f'),
      msg = document.getElementById('msg');
    async function submit(mode) {
      msg.textContent = '正在处理…';
      try {
        const r = await fetch('/api/auth/' + mode, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const d = await r.json();
        if (!r.ok) throw Error(d.message || '操作失败');
        const next = new URLSearchParams(location.search).get('next') || 'gallery.html';
        location.href =
          next.startsWith('/') && !next.startsWith('//')
            ? next
            : next.startsWith('http')
              ? 'gallery.html'
              : next;
      } catch (e) {
        msg.textContent = e.message;
      }
    }
    f.onsubmit = (e) => {
      e.preventDefault();
      submit('login');
    };
    document.getElementById('register').onclick = () => submit('register');
  </script>
</html>
