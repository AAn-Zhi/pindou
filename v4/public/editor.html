<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>豆豆工坊｜图片编辑</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --ink: #302b35;
        --muted: #756d7b;
        --pink: #d77ba6;
        --purple: #8c7bd0;
        --line: #eadfea;
      }
      body {
        margin: 0;
        color: var(--ink);
        font-family: 'Microsoft YaHei', system-ui, sans-serif;
        background: linear-gradient(135deg, #fff8fb, #f5f2ff);
        min-height: 100vh;
      }
      header {
        text-align: center;
        padding: 28px 20px 15px;
      }
      .logo {
        font-size: 28px;
        font-weight: 900;
      }
      .logo span {
        color: var(--pink);
      }
      header p {
        color: var(--muted);
        font-size: 13px;
      }
      main {
        max-width: 1050px;
        margin: auto;
        padding: 10px 18px 45px;
      }
      .card {
        background: #fffffff2;
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 22px;
        box-shadow: 0 12px 35px #55385f0c;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 15px;
      }
      input[type='file'],
      select {
        padding: 10px;
        border: 1px solid #ded3e2;
        border-radius: 11px;
        background: #fff;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 11px 15px;
        font-weight: 800;
        cursor: pointer;
      }
      .primary {
        background: linear-gradient(100deg, #d77ba6, #8c7bd0);
        color: #fff;
      }
      .secondary {
        background: #f2edf8;
        color: #5e4d78;
      }
      .danger {
        background: #fff0f3;
        color: #b04f70;
      }
      .stage {
        min-height: 500px;
        background: repeating-conic-gradient(#faf8fb 0 25%, #f1edf4 0 50%) 50%/20px 20px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        padding: 18px;
      }
      .canvas-wrap {
        position: relative;
        display: inline-block;
        line-height: 0;
        box-shadow: 0 8px 30px #0002;
      }
      .canvas-wrap img {
        display: block;
        max-width: min(900px, 90vw);
        max-height: 650px;
        width: auto;
        height: auto;
      }
      .selection {
        position: absolute;
        border: 2px solid #fff;
        box-shadow: 0 0 0 9999px #231a2b66;
        display: none;
        cursor: move;
      }
      .selection:after {
        content: '';
        position: absolute;
        inset: 7px;
        border: 1px dashed #fff8;
      }
      .hint {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        margin: 10px 0;
      }
      .result {
        display: none;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .result img {
        max-width: 100%;
        max-height: 300px;
        border-radius: 12px;
        border: 1px solid var(--line);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .status {
        color: #4f9a7d;
        font-size: 13px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">✂ <span>豆豆工坊</span> 图片编辑</div>
      <p>拖动鼠标框选主体，再应用裁剪；也可以顺便调整输出宽度。</p>
    </header>
    <main>
      <div class="card">
        <div class="toolbar">
          <input id="file" type="file" accept="image/*" /><label
            >输出宽度
            <select id="scale">
              <option value="0">保持裁剪后的原尺寸</option>
              <option value="500">500 px</option>
              <option value="800" selected>800 px</option>
              <option value="1200">1200 px</option>
              <option value="1600">1600 px</option>
              <option value="2000">2000 px</option>
            </select></label
          ><button class="primary" id="apply" disabled>应用裁剪</button
          ><button class="secondary" id="cutoutWhole" disabled>整张图片手动抠图</button
          ><button class="secondary" id="back">返回生成</button>
        </div>
        <p class="hint">
          ① 先选择图片。② 在图片上按住鼠标拖动出矩形区域。③
          点击“应用裁剪”。如果不框选，则保留整张图片。
        </p>
        <div class="stage">
          <div class="canvas-wrap" id="wrap">
            <img id="img" alt="待编辑图片" />
            <div class="selection" id="sel"></div>
          </div>
          <div id="empty" class="hint">请选择一张图片开始编辑。</div>
        </div>
        <div class="result" id="result">
          <h3>裁剪结果</h3>
          <img id="resultImg" />
          <div class="row" style="margin-top: 12px">
            <button class="primary" id="use">使用这张图片</button
            ><button class="secondary" id="continueCutout">继续手动抠图</button
            ><button class="secondary" id="again">重新裁剪</button>
          </div>
          <div class="status" id="status"></div>
        </div>
        <section class="result" id="cutoutPanel">
          <h3>手动抠图</h3>
          <p class="hint">
            按住鼠标左键在图片上涂抹即可擦除背景。透明区域会显示为棋盘格；使用“恢复画笔”可以把擦除的部分涂回来。
          </p>
          <div class="toolbar">
            <label
              >画笔大小
              <input
                id="brushSize"
                type="range"
                min="5"
                max="120"
                value="32"
                style="vertical-align: middle" /></label
            ><span id="brushLabel">32 px</span
            ><button class="secondary" id="eraseMode">橡皮擦</button
            ><button class="secondary" id="restoreMode">恢复画笔</button
            ><button class="secondary" id="undoCutout">↶ 撤销</button
            ><button class="secondary" id="redoCutout">↷ 恢复</button
            ><button class="danger" id="resetCutout">重新开始抠图</button>
          </div>
          <div class="stage" id="cutoutStage">
            <canvas
              id="cutoutCanvas"
              style="
                display: block;
                max-width: min(900px, 90vw);
                max-height: 650px;
                width: auto;
                height: auto;
                touch-action: none;
                cursor: crosshair;
              "
            ></canvas>
          </div>
          <div class="row" style="margin-top: 14px">
            <button class="primary" id="useCutout">使用抠图结果</button
            ><button class="secondary" id="cancelCutout">取消抠图</button>
          </div>
          <div class="status" id="cutoutStatus"></div>
        </section>
      </div>
    </main>
    <script>
      (() => {
        const file = document.getElementById('file'),
          img = document.getElementById('img'),
          sel = document.getElementById('sel'),
          wrap = document.getElementById('wrap'),
          empty = document.getElementById('empty'),
          apply = document.getElementById('apply'),
          scale = document.getElementById('scale'),
          result = document.getElementById('result'),
          resultImg = document.getElementById('resultImg'),
          use = document.getElementById('use'),
          again = document.getElementById('again'),
          status = document.getElementById('status'),
          back = document.getElementById('back'),
          cutoutWhole = document.getElementById('cutoutWhole'),
          continueCutout = document.getElementById('continueCutout');
        const cutoutPanel = document.getElementById('cutoutPanel'),
          cutoutCanvas = document.getElementById('cutoutCanvas'),
          cutoutStage = document.getElementById('cutoutStage'),
          brushSize = document.getElementById('brushSize'),
          brushLabel = document.getElementById('brushLabel'),
          eraseMode = document.getElementById('eraseMode'),
          restoreMode = document.getElementById('restoreMode'),
          undoCutout = document.getElementById('undoCutout'),
          redoCutout = document.getElementById('redoCutout'),
          resetCutout = document.getElementById('resetCutout'),
          useCutout = document.getElementById('useCutout'),
          cancelCutout = document.getElementById('cancelCutout'),
          cutoutStatus = document.getElementById('cutoutStatus');
        let naturalW = 0,
          naturalH = 0,
          drag = false,
          startX = 0,
          startY = 0,
          box = null,
          currentUrl = '',
          workCanvas = null,
          originalCanvas = null,
          painting = false,
          paintMode = 'erase',
          lastPoint = null,
          undoStack = [],
          redoStack = [];
        function load(url) {
          img.onload = () => {
            naturalW = img.naturalWidth;
            naturalH = img.naturalHeight;
            currentUrl = url;
            empty.style.display = 'none';
            apply.disabled = false;
            cutoutWhole.disabled = false;
            sel.style.display = 'none';
            result.style.display = 'none';
            cutoutPanel.style.display = 'none';
            box = null;
          };
          img.src = url;
        }
        file.onchange = () => {
          const f = file.files?.[0];
          if (!f) return;
          if (f.size > 12 * 1024 * 1024) {
            status.textContent = '图片超过 12 MB';
            return;
          }
          const r = new FileReader();
          r.onload = () => load(r.result);
          r.readAsDataURL(f);
        };
        function point(e) {
          const r = img.getBoundingClientRect();
          return {
            x: Math.max(0, Math.min(r.width, e.clientX - r.left)),
            y: Math.max(0, Math.min(r.height, e.clientY - r.top)),
          };
        }
        wrap.addEventListener('pointerdown', (e) => {
          if (!img.src || cutoutPanel.style.display === 'block') return;
          const p = point(e);
          drag = true;
          startX = p.x;
          startY = p.y;
          sel.style.display = 'block';
          sel.style.left = startX + 'px';
          sel.style.top = startY + 'px';
          sel.style.width = '0px';
          sel.style.height = '0px';
          wrap.setPointerCapture(e.pointerId);
        });
        wrap.addEventListener('pointermove', (e) => {
          if (!drag) return;
          const p = point(e),
            x = Math.min(startX, p.x),
            y = Math.min(startY, p.y),
            w = Math.abs(p.x - startX),
            h = Math.abs(p.y - startY);
          sel.style.left = x + 'px';
          sel.style.top = y + 'px';
          sel.style.width = w + 'px';
          sel.style.height = h + 'px';
          box = { x, y, w, h };
        });
        wrap.addEventListener('pointerup', () => (drag = false));
        wrap.addEventListener('pointercancel', () => (drag = false));
        function makeCanvasFromImage(source) {
          const c = document.createElement('canvas');
          c.width = source.naturalWidth || source.width;
          c.height = source.naturalHeight || source.height;
          c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
          return c;
        }
        apply.onclick = () => {
          if (!img.src) return;
          const r = img.getBoundingClientRect(),
            sx = naturalW / r.width,
            sy = naturalH / r.height;
          let b = box;
          if (!b || b.w < 8 || b.h < 8) b = { x: 0, y: 0, w: r.width, h: r.height };
          const c = document.createElement('canvas');
          let w = Math.max(1, Math.round(b.w * sx)),
            h = Math.max(1, Math.round(b.h * sy)),
            target = +scale.value;
          if (target > 0 && w > target) {
            h = Math.max(1, Math.round((h * target) / w));
            w = target;
          }
          c.width = w;
          c.height = h;
          c.getContext('2d').drawImage(img, b.x * sx, b.y * sy, b.w * sx, b.h * sy, 0, 0, w, h);
          resultImg.src = c.toDataURL('image/png');
          result.style.display = 'block';
          status.textContent = `已裁剪为 ${w} × ${h} px，可直接使用，也可以继续手动抠图。`;
        };
        function openCutout(source) {
          let base;
          if (source instanceof HTMLImageElement) {
            base = makeCanvasFromImage(source);
          } else if (source instanceof HTMLCanvasElement) {
            base = document.createElement('canvas');
            base.width = source.width;
            base.height = source.height;
            base.getContext('2d').drawImage(source, 0, 0);
          } else {
            const im = new Image();
            im.onload = () => openCutout(im);
            im.src = source;
            return;
          }
          // 控制画布尺寸，避免超大照片占用过多内存；透明通道仍会保留。
          const maxSide = 2400,
            ratio = Math.min(1, maxSide / Math.max(base.width, base.height));
          workCanvas = document.createElement('canvas');
          workCanvas.width = Math.max(1, Math.round(base.width * ratio));
          workCanvas.height = Math.max(1, Math.round(base.height * ratio));
          workCanvas.getContext('2d').drawImage(base, 0, 0, workCanvas.width, workCanvas.height);
          originalCanvas = document.createElement('canvas');
          originalCanvas.width = workCanvas.width;
          originalCanvas.height = workCanvas.height;
          originalCanvas.getContext('2d').drawImage(workCanvas, 0, 0);
          cutoutCanvas.width = workCanvas.width;
          cutoutCanvas.height = workCanvas.height;
          cutoutCanvas.getContext('2d').drawImage(workCanvas, 0, 0);
          undoStack = [];
          redoStack = [];
          renderCutout();
          cutoutPanel.style.display = 'block';
          result.style.display = 'none';
          cutoutPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
          cutoutStatus.textContent = '可以开始涂抹背景。已保留原图，可随时撤销或恢复。';
          updateHistoryButtons();
        }
        function renderCutout() {
          const maxW = Math.min(900, window.innerWidth * 0.82),
            maxH = 650,
            ratio = Math.min(1, maxW / cutoutCanvas.width, maxH / cutoutCanvas.height);
          cutoutCanvas.style.width = Math.round(cutoutCanvas.width * ratio) + 'px';
          cutoutCanvas.style.height = Math.round(cutoutCanvas.height * ratio) + 'px';
        }
        function snapshot() {
          try {
            undoStack.push(cutoutCanvas.toDataURL('image/png'));
            if (undoStack.length > 12) undoStack.shift();
            redoStack = [];
            updateHistoryButtons();
          } catch (e) {
            cutoutStatus.textContent = '图片太大，暂时无法记录撤销状态。';
          }
        }
        function restoreSnapshot(url) {
          const im = new Image();
          im.onload = () => {
            const c = cutoutCanvas.getContext('2d');
            c.clearRect(0, 0, cutoutCanvas.width, cutoutCanvas.height);
            c.drawImage(im, 0, 0);
            workCanvas.width = cutoutCanvas.width;
            workCanvas.height = cutoutCanvas.height;
            workCanvas.getContext('2d').drawImage(cutoutCanvas, 0, 0);
            updateHistoryButtons();
          };
          im.src = url;
        }
        function updateHistoryButtons() {
          undoCutout.disabled = !undoStack.length;
          redoCutout.disabled = !redoStack.length;
        }
        function canvasPoint(e) {
          const r = cutoutCanvas.getBoundingClientRect();
          return {
            x: ((e.clientX - r.left) * cutoutCanvas.width) / r.width,
            y: ((e.clientY - r.top) * cutoutCanvas.height) / r.height,
          };
        }
        function paint(e) {
          const p = canvasPoint(e),
            ctx = cutoutCanvas.getContext('2d'),
            radius = Math.max(
              1,
              (+brushSize.value / 2) *
                (cutoutCanvas.width / cutoutCanvas.getBoundingClientRect().width)
            );
          let points = [];
          if (lastPoint) {
            const dist = Math.hypot(p.x - lastPoint.x, p.y - lastPoint.y),
              steps = Math.max(1, Math.ceil(dist / Math.max(2, radius * 0.45)));
            for (let i = 1; i <= steps; i++)
              points.push({
                x: lastPoint.x + ((p.x - lastPoint.x) * i) / steps,
                y: lastPoint.y + ((p.y - lastPoint.y) * i) / steps,
              });
          } else points = [p];
          for (const q of points) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(q.x, q.y, radius, 0, Math.PI * 2);
            ctx.clip();
            if (paintMode === 'erase') {
              ctx.globalCompositeOperation = 'destination-out';
              ctx.fillStyle = 'rgba(0,0,0,1)';
              ctx.beginPath();
              ctx.arc(q.x, q.y, radius, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.globalCompositeOperation = 'source-over';
              ctx.drawImage(originalCanvas, 0, 0);
            }
            ctx.restore();
          }
          lastPoint = p;
          const c = workCanvas.getContext('2d');
          c.clearRect(0, 0, workCanvas.width, workCanvas.height);
          c.drawImage(cutoutCanvas, 0, 0);
        }
        cutoutCanvas.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          painting = true;
          lastPoint = null;
          snapshot();
          cutoutCanvas.setPointerCapture(e.pointerId);
          paint(e);
        });
        cutoutCanvas.addEventListener('pointermove', (e) => {
          if (painting) paint(e);
        });
        function endPaint() {
          painting = false;
          lastPoint = null;
        }
        cutoutCanvas.addEventListener('pointerup', endPaint);
        cutoutCanvas.addEventListener('pointercancel', endPaint);
        brushSize.oninput = () => (brushLabel.textContent = brushSize.value + ' px');
        eraseMode.onclick = () => {
          paintMode = 'erase';
          eraseMode.className = 'primary';
          restoreMode.className = 'secondary';
          cutoutStatus.textContent = '橡皮擦模式：涂抹区域将变透明。';
        };
        restoreMode.onclick = () => {
          paintMode = 'restore';
          restoreMode.className = 'primary';
          eraseMode.className = 'secondary';
          cutoutStatus.textContent = '恢复画笔模式：涂抹区域将恢复原图。';
        };
        undoCutout.onclick = () => {
          if (!undoStack.length) return;
          redoStack.push(cutoutCanvas.toDataURL('image/png'));
          restoreSnapshot(undoStack.pop());
          updateHistoryButtons();
        };
        redoCutout.onclick = () => {
          if (!redoStack.length) return;
          undoStack.push(cutoutCanvas.toDataURL('image/png'));
          restoreSnapshot(redoStack.pop());
          updateHistoryButtons();
        };
        resetCutout.onclick = () => {
          if (!originalCanvas) return;
          snapshot();
          const ctx = cutoutCanvas.getContext('2d');
          ctx.clearRect(0, 0, cutoutCanvas.width, cutoutCanvas.height);
          ctx.drawImage(originalCanvas, 0, 0);
          workCanvas.getContext('2d').clearRect(0, 0, workCanvas.width, workCanvas.height);
          workCanvas.getContext('2d').drawImage(originalCanvas, 0, 0);
          cutoutStatus.textContent = '已恢复为刚开始抠图时的图片。';
        };
        useCutout.onclick = () => {
          sessionStorage.setItem('doudou_edited_image', cutoutCanvas.toDataURL('image/png'));
          location.href = 'index.html';
        };
        cancelCutout.onclick = () => {
          cutoutPanel.style.display = 'none';
          cutoutStatus.textContent = '已取消抠图。';
        };
        cutoutWhole.onclick = () => openCutout(img);
        continueCutout.onclick = () => openCutout(resultImg);
        use.onclick = () => {
          sessionStorage.setItem('doudou_edited_image', resultImg.src);
          location.href = 'index.html';
        };
        again.onclick = () => {
          result.style.display = 'none';
          sel.style.display = 'none';
          box = null;
        };
        back.onclick = () => (location.href = 'index.html');
        const pending = sessionStorage.getItem('doudou_editor_source');
        if (pending) {
          sessionStorage.removeItem('doudou_editor_source');
          load(pending);
        }
      })();
    </script>
    <script src="auth.js"></script>
  </body>
</html>
